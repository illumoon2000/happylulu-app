name: Mac HappyLulu

on:
  push:
    branches: [main, 'cy-agent/**', 'codex/**']
    paths:
      - 'Sources/**'
      - 'windows/HappyLulu.Core/**'
      - 'Tests/**'
      - 'Resources/**'
      - 'scripts/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'RELEASE-NOTES.md'
      - '.github/workflows/macos.yml'
  pull_request:
    paths:
      - 'Sources/**'
      - 'windows/HappyLulu.Core/**'
      - 'Tests/**'
      - 'Resources/**'
      - 'scripts/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'RELEASE-NOTES.md'
      - '.github/workflows/macos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      # CI verifies packaging without accessing a developer's signing keys.
      HAPPY_LULU_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts and app metadata
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          plutil -lint Resources/Info.plist
          git diff --check
          python3 scripts/check-release-delivery.py
      - name: Check attendance and calendar logic
        run: |
          swift run --build-system native AfterSixChecks
          swift run --build-system native AfterSixParityChecks Tests/Shared/attendance.json
          swift run --build-system native CalendarSyncChecks
          swift run --build-system native CalendarSyncServiceChecks
      - name: Check isolated calendar and updater integration
        run: |
          bash scripts/check-calendar-model.sh
          bash scripts/check-calendar-diagnostics.sh
          bash scripts/check-calendar-runtime.sh
          bash scripts/check-automatic-install.sh
          bash scripts/check-runtime-profile.sh
          bash scripts/check-clock-paste.sh
          bash scripts/check-panel-focus.sh
          bash scripts/check-appearance-model.sh
          bash scripts/check-settings-navigation.sh
          bash scripts/check-plugin-architecture.sh
          bash scripts/check-vacation-eve.sh
          bash scripts/check-vacation-appearance.sh
          bash scripts/check-plugin-isolation.sh
      - name: Check optional Daouoffice integration
        run: |
          if [[ "${HAPPY_LULU_DISABLE_DAOUOFFICE:-}" != "1" && -d Sources/DaouOfficePlugin && -d Sources/DaouOfficeIntegration ]]; then
            swift run --build-system native AppPluginChecks
            bash scripts/check-daouoffice-model.sh
            bash scripts/check-edit-menu.sh
          else
            echo 'Daouoffice module is excluded; common app checks still run.'
          fi
      - name: Check optional AI usage integration
        run: |
          if [[ "${HAPPY_LULU_DISABLE_AI_USAGE:-}" != "1" && -d Sources/AIUsagePlugin && -d Sources/AIUsageIntegration ]]; then
            swift test --build-system native --filter AIUsageTests
            bash scripts/check-ai-usage-ui.sh
          else
            echo 'AI usage module is excluded; common app checks still run.'
          fi
      - name: Package and verify Universal app without private keys
        run: |
          bash scripts/package-release.sh
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Resources/Info.plist)
          python3 scripts/verify-release.py "dist/releases/$version-build$build"
          echo "RELEASE_DIR=dist/releases/$version-build$build" >> "$GITHUB_ENV"
      - name: Check Sparkle configuration without private keys
        run: swift run --build-system native AppUpdateChecks "$RELEASE_DIR/HappyLulu.app" --configuration-only
      - uses: actions/upload-artifact@v4
        with:
          name: HappyLulu-macos-unsigned-for-distribution-${{ github.sha }}
          path: |
            ${{ env.RELEASE_DIR }}/*.zip
            ${{ env.RELEASE_DIR }}/*.dmg
            ${{ env.RELEASE_DIR }}/*.md
            ${{ env.RELEASE_DIR }}/LICENSE
            ${{ env.RELEASE_DIR }}/build-source.json
            ${{ env.RELEASE_DIR }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
