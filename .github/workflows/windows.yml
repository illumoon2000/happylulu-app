name: Windows HappyLulu

on:
  push:
    paths:
      - 'windows/**'
      - 'Sources/AfterSixCore/**'
      - 'Tests/Shared/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'Sources/AfterSixCore/**'
      - 'Tests/Shared/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check platform-independent attendance core
        run: dotnet run --project windows/HappyLulu.Checks/HappyLulu.Checks.csproj --configuration Release
      - name: Check shared Mac and Windows workday expectations
        run: dotnet run --project windows/HappyLulu.ParityChecks/HappyLulu.ParityChecks.csproj --configuration Release -- Tests/Shared/attendance.json
      - name: Publish portable Windows app with bundled runtime
        run: dotnet publish windows/HappyLulu.Tray/HappyLulu.Tray.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false --output dist/windows/self-contained
      - name: Publish small portable Windows app requiring Desktop Runtime
        run: dotnet publish windows/HappyLulu.Tray/HappyLulu.Tray.csproj --configuration Release --runtime win-x64 --self-contained false -p:PublishSingleFile=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false --output dist/windows/runtime-required
      - name: Package both Windows builds
        shell: pwsh
        run: |
          foreach ($flavor in @('self-contained', 'runtime-required')) {
            Copy-Item LICENSE, THIRD_PARTY_NOTICES.md "dist/windows/$flavor/"
          }
          # Preserve the Windows .NET distribution's own license and full notices.
          $dotnetRoot = Split-Path (Get-Command dotnet).Source -Parent
          $noticeDir = 'dist/windows/self-contained/licenses/dotnet'
          New-Item -ItemType Directory -Force $noticeDir | Out-Null
          foreach ($name in @('LICENSE.txt', 'ThirdPartyNotices.txt')) {
            $source = Join-Path $dotnetRoot $name
            if (-not (Test-Path $source)) { throw "Missing bundled .NET notice: $source" }
            Copy-Item $source $noticeDir
          }
          Compress-Archive -Path dist/windows/self-contained/* -DestinationPath dist/windows/HappyLulu-1.2.1-windows-x64.zip
          Compress-Archive -Path dist/windows/runtime-required/* -DestinationPath dist/windows/HappyLulu-1.2.1-windows-x64-runtime-required.zip
          Get-FileHash dist/windows/*.zip -Algorithm SHA256 | ForEach-Object {
            '{0}  {1}' -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf)
          } | Set-Content -Encoding ascii dist/windows/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HappyLulu-1.2.1-windows-x64
          path: dist/windows/HappyLulu-1.2.1-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HappyLulu-1.2.1-windows-x64-runtime-required
          path: dist/windows/HappyLulu-1.2.1-windows-x64-runtime-required.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HappyLulu-1.2.1-windows-checksums
          path: dist/windows/SHA256SUMS.txt
